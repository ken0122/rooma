name: Deploy production Worker

on:
  push:
    branches:
      - main

concurrency:
  group: rooma-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test

      - name: Deploy rooma-3d-editor
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --config dist/server/wrangler.json
            --name rooma-3d-editor
            --keep-vars
            --message "Deploy main ${{ github.sha }}"

      - name: Verify production
        shell: bash
        run: |
          for attempt in {1..12}; do
            if response="$(curl --fail --silent --show-error --max-time 30 https://rooma-3d-editor.ron-nextop.workers.dev/)" \
              && grep --quiet "ROOMA" <<<"$response"; then
              echo "Production verification passed on attempt $attempt."
              exit 0
            fi
            sleep 5
          done
          echo "Production verification failed."
          exit 1
